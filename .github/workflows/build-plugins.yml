name: Build and publish plugins

on:
  push:
    branches:
      - main
    paths:
      - 'vspc-*/**'
      - 'sleet.json'
      - '.github/workflows/build-plugins.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  build-publish:
    name: Build vspc-* plugins and publish the NuGet feed
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build plugins and publish to /repository feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\.github\scripts\publish-plugins.ps1
